name: notebooks

on:
  # Restricted to main so a branch with an open PR does not run this twice - once for the push
  # and once for the pull_request - on every commit. Branch work is covered by pull_request.
  push:
    branches: [main]
    paths:
      - "notebooks/**"
      - "scripts/smoke_test.sh"
      - ".github/workflows/notebooks.yml"
  pull_request:
    paths:
      - "notebooks/**"
      - "scripts/smoke_test.sh"
      - ".github/workflows/notebooks.yml"
  workflow_dispatch:

# Executing the labs takes tens of minutes; superseded commits should not hold runners. Runs on
# main are never cancelled, so the default branch always keeps a complete history of results.
concurrency:
  group: notebooks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  execute:
    # Labs 1 and 2 only: they need no GPU, no model download, and no Hugging Face credentials,
    # so they are cheap enough to run on every push. Labs 3 and 4 pull ~1 GB of weights and are
    # verified locally with `scripts/smoke_test.sh all`.
    name: execute labs 1-2 (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # setup-python only globs for requirements.txt / pyproject.toml by default, and this
          # repo splits its dependencies per lab. Without this the step fails outright rather
          # than skipping the cache.
          cache-dependency-path: notebooks/requirements-*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r notebooks/requirements-core.txt
          pip install nbconvert nbformat ipykernel

      - name: Check notebooks are committed without outputs
        run: |
          python - <<'PY'
          import json, pathlib, sys
          dirty = []
          for path in sorted(pathlib.Path("notebooks").glob("*.ipynb")):
              nb = json.loads(path.read_text())
              for i, cell in enumerate(nb["cells"]):
                  if cell.get("outputs") or cell.get("execution_count") is not None:
                      dirty.append(f"{path}: cell {i}")
          if dirty:
              print("Notebooks must be committed with outputs cleared:")
              print("\n".join(dirty))
              print("\nFix with: jupyter nbconvert --clear-output --inplace notebooks/*.ipynb")
              sys.exit(1)
          print("all notebooks are clean")
          PY

      - name: Execute labs 1 and 2
        run: bash scripts/smoke_test.sh
