name: notebooks

on:
  # Restricted to main so a branch with an open PR does not run this twice - once for the push
  # and once for the pull_request - on every commit. Branch work is covered by pull_request.
  push:
    branches: [main]
    paths:
      - "notebooks/**"
      - "scripts/smoke_test.sh"
      - ".github/workflows/notebooks.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
  pull_request:
    paths:
      - "notebooks/**"
      - "scripts/smoke_test.sh"
      - ".github/workflows/notebooks.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
  workflow_dispatch:

# Executing the labs takes tens of minutes; superseded commits should not hold runners. Runs on
# main are never cancelled, so the default branch always keeps a complete history of results.
concurrency:
  group: notebooks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  execute:
    # Labs 1 and 2 only: they need no GPU, no model download, and no Hugging Face credentials,
    # so they are cheap enough to run on every push. Labs 3 and 4 pull ~1 GB of weights and are
    # verified locally with `scripts/smoke_test.sh all`.
    name: execute labs 1-2 (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # Cache on the lock rather than on the manifest, so the key changes exactly when a
          # resolved version does. The Python version comes from .python-version.
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        # Only the base dependencies and the dev group: Labs 1 and 2 need neither the Hugging Face
        # stack nor JAX/Ray. torch resolves to the CPU wheel here through the pytorch-cpu index
        # that pyproject.toml pins for Linux. --locked fails the build if uv.lock is out of date
        # with pyproject.toml instead of silently resolving something else.
        run: uv sync --locked

      - name: Check notebooks are committed without outputs
        run: |
          uv run python - <<'PY'
          import json, pathlib, sys
          dirty = []
          for path in sorted(pathlib.Path("notebooks").glob("*.ipynb")):
              nb = json.loads(path.read_text())
              for i, cell in enumerate(nb["cells"]):
                  if cell.get("outputs") or cell.get("execution_count") is not None:
                      dirty.append(f"{path}: cell {i}")
          if dirty:
              print("Notebooks must be committed with outputs cleared:")
              print("\n".join(dirty))
              print("\nFix with: jupyter nbconvert --clear-output --inplace notebooks/*.ipynb")
              sys.exit(1)
          print("all notebooks are clean")
          PY

      - name: Execute labs 1 and 2
        # The "ci" profile trims the training budget to the smallest one that still passes every
        # assertion. Run scripts/smoke_test.sh locally for the full-margin profile.
        env:
          SMOKE_PROFILE: ci
        run: bash scripts/smoke_test.sh
